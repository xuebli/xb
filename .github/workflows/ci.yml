name: CI

on:
  push:
    branches: [release_v0, main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check xb tests

      - name: Test (pytest)
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -v --tb=line -ra 2>&1 | tee pytest-output.txt

      - name: Expose failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)" pytest-output.txt | while IFS= read -r line; do
            echo "::error::${line:0:250}"
          done
          grep -E "^(FAILED|ERROR)" pytest-output.txt || echo "::error::no FAILED lines captured"
